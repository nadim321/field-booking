
name: Booking System CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20.19.0"

jobs:
  frontend-ci:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Upload Angular build
        uses: actions/upload-artifact@v4
        with:
          name: angular-production
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

  backend-ci:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Check JavaScript syntax
        run: node --check server.js

  deploy-production:
    name: Deploy to cPanel
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Angular build
        uses: actions/download-artifact@v4
        with:
          name: angular-production
          path: ./angular-dist

      - name: Locate Angular output
        id: frontend
        shell: bash
        run: |
          INDEX_FILE="$(find ./angular-dist \
            -type f -name index.html -print -quit)"

          if [ -z "$INDEX_FILE" ]; then
            echo "Angular index.html not found"
            exit 1
          fi

          echo "dist_dir=$(dirname "$INDEX_FILE")" \
            >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<'EOF'
          Host cpanel-deploy
            HostName ${{ secrets.CPANEL_HOST }}
            User ${{ secrets.CPANEL_USER }}
            Port ${{ secrets.CPANEL_PORT }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Verify SSH access
        run: ssh cpanel-deploy "whoami"

      - name: Deploy Angular frontend
        env:
          FRONTEND_PATH: ${{ vars.CPANEL_FRONTEND_PATH }}
          DIST_DIR: ${{ steps.frontend.outputs.dist_dir }}
        run: |
          test -f "$DIST_DIR/index.html"
          test -n "$FRONTEND_PATH"

          ssh cpanel-deploy \
            "mkdir -p '$FRONTEND_PATH'"

          rsync -az --delete \
            "$DIST_DIR/" \
            "cpanel-deploy:$FRONTEND_PATH/"

      - name: Deploy Node.js backend
        env:
          BACKEND_PATH: ${{ vars.CPANEL_BACKEND_PATH }}
        run: |
          test -n "$BACKEND_PATH"

          ssh cpanel-deploy \
            "mkdir -p '$BACKEND_PATH'"

          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='tmp/' \
            --exclude='logs/' \
            backend/ \
            "cpanel-deploy:$BACKEND_PATH/"

      - name: Install production dependencies
        env:
          BACKEND_PATH: ${{ vars.CPANEL_BACKEND_PATH }}
          NODE_ENV_PATH: ${{ vars.CPANEL_NODE_ENV_PATH }}
        run: |
          test -n "$NODE_ENV_PATH"

          ssh cpanel-deploy \
            "cd '$BACKEND_PATH' && \
             source '$NODE_ENV_PATH/bin/activate' && \
             npm ci --omit=dev"

      - name: Restart Node.js application
        env:
          RESTART_FILE: ${{ vars.CPANEL_RESTART_FILE }}
        run: |
          test -n "$RESTART_FILE"

          ssh cpanel-deploy \
            "mkdir -p \"\$(dirname '$RESTART_FILE')\" && \
             touch '$RESTART_FILE'"

      - name: Verify deployed application
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_HEALTH_URL }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          set -e

          check_url() {
            URL="$1"
            echo "Checking $URL"

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error \
                   --output /dev/null "$URL"; then
                echo "Health check passed"
                return 0
              fi

              echo "Attempt $attempt failed; retrying..."
              sleep 5
            done

            echo "Health check failed: $URL"
            return 1
          }

          check_url "$FRONTEND_URL"
          check_url "$API_HEALTH_URL"

