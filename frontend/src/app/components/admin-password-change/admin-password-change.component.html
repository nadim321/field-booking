<section class="password-panel" aria-labelledby="password-title">
  <form class="password-card" (ngSubmit)="submit()" #passwordForm="ngForm">
    <h2 id="password-title">Change your password</h2>
    <p class="intro">Enter your current password, then choose a new password with at least 8 characters.</p>

    <label for="current-password">Current password</label>
    <input id="current-password" type="password" name="currentPassword" [(ngModel)]="currentPassword"
      autocomplete="current-password" required [disabled]="loading" />

    <label for="new-password">New password</label>
    <input id="new-password" type="password" name="newPassword" [(ngModel)]="newPassword"
      autocomplete="new-password" minlength="8" required [disabled]="loading" />

    <label for="confirm-password">Confirm new password</label>
    <input id="confirm-password" type="password" name="confirmPassword" [(ngModel)]="confirmPassword"
      autocomplete="new-password" required [disabled]="loading" />
    <p *ngIf="confirmPassword && !passwordsMatch" class="field-error" role="alert">The new passwords do not match.</p>

    <p *ngIf="error" class="form-error" role="alert">{{ error }}</p>
    <p class="session-note">Changing your password signs out all sessions for this account. You will need to sign in again.</p>

    <button type="submit" [disabled]="passwordForm.invalid || !passwordsMatch || loading">
      {{ loading ? 'Changing password…' : 'Change password' }}
    </button>
  </form>
</section>
